# Collection policies. The CollectionPolicyEngine consults this file.
# Defaults must FAIL CLOSED for risky collection.

policies:
  safe_public_web:
    description: Standard public web pages, RSS, blogs, vendor research
    allow_fetch: true
    fetch_mode: text
    allow_javascript: false
    allow_file_download: false
    allow_binary_download: false
    respect_robots_txt: true
    require_https: false
    max_depth: 1

  public_social_metadata:
    description: Public social platforms via official RSS/API only; metadata + posts
    allow_fetch: true
    fetch_mode: text
    allow_javascript: false
    allow_file_download: false
    allow_binary_download: false
    respect_robots_txt: true
    require_https: true
    max_depth: 1

  metadata_only:
    description: GitHub repos, app stores, etc. — collect metadata, never source/binaries
    allow_fetch: true
    fetch_mode: metadata_only
    allow_javascript: false
    allow_file_download: false
    allow_binary_download: false
    respect_robots_txt: true
    require_https: true
    max_depth: 0

  passive_metadata_only:
    description: Onion / dark web — passive metadata only, disabled by default
    allow_fetch: false
    fetch_mode: metadata_only
    allow_javascript: false
    allow_file_download: false
    allow_binary_download: false
    respect_robots_txt: true
    require_https: false
    max_depth: 0
    requires_analyst_approval: true
    safety_mode: passive_only

  high_risk_disabled:
    description: Paste sites, leak sites, exploit drops, criminal forums — always denied
    allow_fetch: false
    fetch_mode: deny
    requires_analyst_approval: true

# Blanket prohibitions regardless of source.
prohibited_actions:
  - authenticate_to_criminal_services
  - collect_stolen_credentials
  - collect_victim_data_dumps
  - purchase_or_validate_illicit_data
  - interact_with_threat_actors
  - bypass_authentication_or_captchas
  - bypass_robots_txt
  - exploit_vulnerabilities
  - execute_malware_or_exploits
  - download_malware_samples
  - clone_exploit_repositories
  - submit_forms_to_suspicious_sites
  - active_scanning_third_party_systems

# Hosts that should never appear as block-recommended IOCs (false positive risk).
