services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cti
      POSTGRES_PASSWORD: cti
      POSTGRES_DB: cti
    ports:
      - "5432:5432"
    volumes:
      - cti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti -d cti"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["optional"]

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CTI_DATABASE_URL: postgresql+psycopg://cti:cti@postgres:5432/cti
      CTI_ENV: local
      CTI_LOG_LEVEL: INFO
      # CONSCIOUS CHOICE — this compose bundle is a LOCAL, single-user demo:
      # CTI_OPEN_ACCESS=true disables authentication entirely while no user
      # account exists (legacy zero-user open mode, e.g. for MCP/automation).
      # The container publishes 8000 on all interfaces, so anyone who can
      # reach this host can use the instance. For any shared or exposed
      # deployment, DELETE this line: the app then starts in setup-required
      # mode and forces first-run admin creation at /setup before serving
      # anything. (Alternatively set CTI_API_KEY to gate the REST API.)
      CTI_OPEN_ACCESS: "true"
    command: >
      sh -c "alembic upgrade head && uvicorn scry.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      # Persists the auto-generated Fernet key (CTI_SECRET_FILE) and any
      # container-local data across rebuilds. Without it, re-creating the
      # container makes previously stored (encrypted) secrets unreadable.
      - cti_data:/app/data

  scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CTI_DATABASE_URL: postgresql+psycopg://cti:cti@postgres:5432/cti
      CTI_ENV: local
    command: ["python", "-m", "scry.scheduler"]
    profiles: ["optional"]
    volumes:
      - ./config:/app/config:ro
      - cti_data:/app/data

volumes:
  cti_pgdata: {}
  cti_data: {}
