services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random database password}
      POSTGRES_DB: cti
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti -d cti"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    profiles: ["optional"]

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CTI_DATABASE_URL: postgresql+psycopg://cti:${POSTGRES_PASSWORD}@postgres:5432/cti
      CTI_ENV: local
      CTI_LOG_LEVEL: INFO
      CTI_SETUP_TOKEN: ${CTI_SETUP_TOKEN:-}
    command: >
      sh -c "alembic upgrade head && uvicorn scry.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/app/config:ro
      # Persists the auto-generated Fernet key (CTI_SECRET_FILE) and any
      # container-local data across rebuilds. Without it, re-creating the
      # container makes previously stored (encrypted) secrets unreadable.
      - cti_data:/app/data

  scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CTI_DATABASE_URL: postgresql+psycopg://cti:${POSTGRES_PASSWORD}@postgres:5432/cti
      CTI_ENV: local
    command: ["python", "-m", "scry.scheduler"]
    profiles: ["optional"]
    volumes:
      - ./config:/app/config:ro
      - cti_data:/app/data

volumes:
  cti_pgdata: {}
  cti_data: {}
