services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cti
      POSTGRES_PASSWORD: cti
      POSTGRES_DB: cti
    ports:
      - "5432:5432"
    volumes:
      - cti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti -d cti"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["optional"]

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CTI_DATABASE_URL: postgresql+psycopg://cti:cti@postgres:5432/cti
      CTI_ENV: local
      CTI_LOG_LEVEL: INFO
    command: >
      sh -c "alembic upgrade head && uvicorn scry.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro

  scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CTI_DATABASE_URL: postgresql+psycopg://cti:cti@postgres:5432/cti
      CTI_ENV: local
    command: ["python", "-m", "scry.scheduler"]
    profiles: ["optional"]
    volumes:
      - ./config:/app/config:ro

volumes:
  cti_pgdata: {}
