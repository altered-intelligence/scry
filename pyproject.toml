[project]
name = "scry"
version = "0.16.1"
description = "Scry — defensive CTI collection, extraction, enrichment, correlation, search, and reporting platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Scry" }]
keywords = ["scry", "cti", "threat-intelligence", "defensive-security", "ioc", "osint"]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  "httpx>=0.27",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.1",
  "trafilatura>=1.7",
  "readability-lxml>=0.8",
  "tldextract>=5.1",
  "python-dateutil>=2.8",
  "PyYAML>=6.0",
  "tenacity>=8.2",
  "rich>=13.7",
  "typer>=0.9",
  "jinja2>=3.1",
  "apscheduler>=3.10",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "cryptography>=42.0",
  "anthropic>=0.40",
  "openai>=1.40",
  "google-generativeai>=0.7",
  "bcrypt>=4",
  "pyotp>=2.9",
  "qrcode[pil]>=7",
  "webauthn>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "black>=24.2",
  "mypy>=1.8",
  "respx>=0.20",
  "httpx>=0.27",
  "freezegun>=1.4",
]
# Embedded local LLM for AI Search (GGUF inference; ~1 GB model downloaded
# separately via `scry ai-setup`). Base install stays light without this.
ai = [
  "llama-cpp-python>=0.3.35",
]
# MCP server for AI clients (Claude Desktop, Cursor…): `scry mcp`.
# Pinned to 1.x: 2.x renamed FastMCP (see the migration guide).
mcp = [
  "mcp>=1.8,<2",
]

[project.scripts]
scry = "scry.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scry*"]

[tool.setuptools.package-data]
scry = ["data/*.json", "ui/templates/*.html", "ui/static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
